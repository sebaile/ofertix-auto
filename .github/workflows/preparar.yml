name: Preparar borradores
# Plan diario (tools/plan.mjs, hora de Chile): historias 08:00, carrusel 11:00 y 18:30, Reel 13:00 y 20:30.
# Revisa cada 15 minutos entre las 07:00 y las 23:30 de Chile (en UTC, con margen para el cambio de horario).
# Una comprobación rápida decide si toca preparar algo; si no, la ejecución termina en segundos.
on:
  schedule:
    - cron: '*/15 10-23,0-3 * * *'
  workflow_dispatch:
    inputs:
      tipo:
        description: 'id del plan (historias, carrusel-a, reel-a, carrusel-b, reel-b), tipo (carrusel, reel) o prueba-historia'
        required: false
        default: ''
      forzar:
        description: 'Ignorar la hora (true/false)'
        required: false
        default: 'false'
      prueba:
        description: 'Publicación de prueba aparte de las del día (true/false)'
        required: false
        default: 'false'

concurrency:
  group: ofertix-estado
  cancel-in-progress: false
permissions:
  contents: write
  actions: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Santiago
      GH_TOKEN: ${{ github.token }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      DB_URL_LECTURA: ${{ secrets.DB_URL_LECTURA }}
      TIPO: ${{ inputs.tipo }}
      FORZAR: ${{ inputs.forzar }}
      PRUEBA: ${{ inputs.prueba }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main      # siempre la última versión del estado, aunque la ejecución haya esperado en cola
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ¿Toca preparar algo?
        id: due
        run: |
          if [ -n "$TIPO" ]; then echo "hay=true" >> "$GITHUB_OUTPUT"; echo "Lanzado a mano: $TIPO"; else node tools/due.mjs; fi
      - name: Herramientas del sistema (ffmpeg y emojis)
        if: steps.due.outputs.hay == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
      - name: Dependencias
        if: steps.due.outputs.hay == 'true'
        run: npm ci --no-audit --no-fund
      - name: Preparar
        if: steps.due.outputs.hay == 'true'
        run: |
          ARGS=""
          case "$TIPO" in historias|carrusel|reel|carrusel-a|carrusel-b|reel-a|reel-b|prueba-historia) ARGS="$TIPO";; esac
          [ "$FORZAR" = "true" ] && ARGS="$ARGS --forzar"
          [ "$PRUEBA" = "true" ] && ARGS="$ARGS --prueba"
          node tools/nube.mjs preparar $ARGS
      - name: Guardar estado y borradores
        if: steps.due.outputs.hay == 'true'
        run: |
          git config user.name "ofertix-bot"; git config user.email "ofertix-bot@users.noreply.github.com"
          git add datos
          git diff --cached --quiet || { git commit -q -m "Borradores y estado $(date -u +'%F %H:%M')" && git pull --rebase -q && git push -q; }
